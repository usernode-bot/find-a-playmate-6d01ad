<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <!-- Find a playmate featured icon, light look: cream field, black rackets, outlined yellow skirt -->
  <rect width="1600" height="1000" fill="#FFFEEA"/>
  <g transform="translate(364 110) scale(0.851)">
    <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
      <!-- left racket: head upper-left, grip lower-right -->
      <ellipse cx="307" cy="348" rx="100" ry="140" transform="rotate(-45 307 348)" stroke-width="46"/>
      <path d="M407 446 L620 640" stroke-width="46"/>
      <path d="M620 640 L740 772" stroke-width="82"/>
      <!-- right racket: head upper-right, grip lower-left -->
      <ellipse cx="717" cy="348" rx="100" ry="140" transform="rotate(45 717 348)" stroke-width="46"/>
      <path d="M617 446 L404 640" stroke-width="46"/>
      <path d="M404 640 L284 772" stroke-width="82"/>
    </g>
    <!-- shuttlecock between the heads, cork pointing down -->
    <path d="M455 130 A80 80 0 0 1 569 130 L537 252 A35 35 0 0 1 487 252 Z" fill="#FFEE6F" stroke="#000000" stroke-width="20" stroke-linejoin="round"/>
    <circle cx="512" cy="288" r="40" fill="#000000"/>
  </g>
</svg>
